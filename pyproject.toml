[project]
name = "signal-factory"
version = "0.1.0"
description = "Can an LLM propose derived fraud signals that beat routine aggregations?"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "lightgbm",
    "scikit-learn",
    "pydantic>=2",
    "numpy",
    "pyyaml",
]

[project.scripts]
signal-factory = "signal_factory.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "mypy",
    "ruff",
    "pandas-stubs",
    "types-PyYAML",
]
routine-ft = [
    "featuretools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_factory"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "duckdb.*", "sklearn.*", "featuretools.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
